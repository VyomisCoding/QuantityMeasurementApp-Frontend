<div class="auth-container">

  <div class="auth-card">

    <!-- Toggle -->
    <div class="toggle">
      <button [class.active]="isLogin" (click)="isLogin = true">Login</button>
      <button [class.active]="!isLogin" (click)="isLogin = false">Signup</button>
    </div>

    <!-- LOGIN -->
    <form *ngIf="isLogin" (ngSubmit)="handleLogin()">

      <h3>Welcome Back 👋</h3>
      <p class="subtitle">Login to continue</p>

      <div class="input-group">
        <input 
          type="text"
          [(ngModel)]="username"
          name="loginUsername"
          placeholder=" "
          required>
        <label>Username</label>
      </div>

      <div class="input-group">
        <input 
          type="password"
          [(ngModel)]="password"
          name="loginPassword"
          placeholder=" "
          required>
        <label>Password</label>
      </div>

      <button class="btn-primary">Login</button>

    </form>

    <!-- SIGNUP -->
    <form *ngIf="!isLogin" (ngSubmit)="handleSignup()">

      <h3>Create Account 🚀</h3>
      <p class="subtitle">Signup to get started</p>

      <div class="input-group">
        <input 
          type="text"
          [(ngModel)]="username"
          name="signupUsername"
          placeholder=" "
          required>
        <label>Username</label>
      </div>

      <div class="input-group">
        <input 
          type="password"
          [(ngModel)]="password"
          name="signupPassword"
          placeholder=" "
          required>
        <label>Password</label>
      </div>

      <button class="btn-primary">Signup</button>

    </form>

  </div>

</div>
