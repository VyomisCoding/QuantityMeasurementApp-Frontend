<div class="main-container">

  <h5 class="title">Choose Measurement Type</h5>

  <div class="row g-4 justify-content-center">

    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let card of measurementCards">
      
      <app-card
        class="card-wrapper"
        [title]="card.title"
        [emoji]="card.emoji"
        [type]="card.type"
        [selectedType]="selectedType"
        (onSelect)="selectType($event)">
      </app-card>

    </div>

  </div>

</div>

<app-operation
  *ngIf="selectedType"
  [selectedType]="selectedType">
</app-operation>
